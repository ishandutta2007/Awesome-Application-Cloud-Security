emFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.pill-label,.tagline-text{font-weight:600}.tagline-text{font-size:14px;letter-spacing:2px;fill:#00f2fe;text-transform:uppercase}.pill-label{font-size:13px;fill:#e2e8f0}.node-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;font-weight:600;fill:#38bdf8}.ambient-orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.ambient-orb-2{animation:pulseOrb 10s ease-in-out infinite reverse;transform-origin:1000px 250px}.stream-beam{stroke-dasharray:20 60;animation:beamFlow 3.5s linear infinite}.stream-beam-reverse{stroke-dasharray:30 70;animation:beamFlow 4.5s linear infinite reverse}.radar-rotator{transform-origin:1050px 150px;animation:radarSweep 12s linear infinite}.pill-group{animation:floatPill 5s ease-in-out infinite}.pill-group:nth-child(2){animation-delay:-1.8s}.pill-group:nth-child(3){animation-delay:-3.2s}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="18"/><rect width="1200" height="420" fill="url(#grid)" rx="18"/><g><circle cx="220" cy="120" r="140" fill="#00f2fe" class="ambient-orb-1" filter="url(#softGlow)"/><circle cx="980" cy="220" r="160" fill="#7f00ff" class="ambient-orb-2" filter="url(#softGlow)"/><circle cx="600" cy="380" r="180" fill="#0284c7" filter="url(#softGlow)" opacity=".18"/></g><g opacity=".45"><path fill="none" stroke="#1e293b" stroke-width="2" d="M 120 340 Q 300 240 500 310 T 880 290 T 1140 180"/><path fill="none" stroke="#00f2fe" stroke-width="2.5" d="M 120 340 Q 300 240 500 310 T 880 290 T 1140 180" class="stream-beam" filter="url(#glow)"/><path fill="none" stroke="#1e293b" stroke-width="1.8" d="M 60 120 Q 350 40 680 140 T 1120 90"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 60 120 Q 350 40 680 140 T 1120 90" class="stream-beam-reverse" filter="url(#glow)"/></g><g opacity=".55"><circle cx="1050" cy="150" r="90" fill="none" stroke=